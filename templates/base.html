<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Global Company{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --border: #d7dce2;
      --text: #1f2933;
      --muted: #697586;
      --primary: #176b87;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    header a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      margin: 0;
    }
    .muted { color: var(--muted); }
    .button, button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 12px;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }
    .button.primary, button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .button.danger, button.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    th {
      color: var(--muted);
      font-weight: 700;
      background: #eef3f5;
    }
    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .tile {
      display: block;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
    }
    .tile strong {
      display: block;
      margin-bottom: 6px;
      font-size: 16px;
    }
    .form {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    label span {
      display: block;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 700;
    }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
    }
    .messages, .errors {
      margin: 0 0 16px;
      padding: 0;
      list-style: none;
    }
    .messages li, .errors li {
      background: #fff8e6;
      border: 1px solid #e9d8a6;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 16px;
    }
    .readonly {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'common:table-index' %}">Global Company Tables</a>
    <span class="muted">global_company schema</span>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
